{% comment %}
    One invoice item row.

    Used in three places, all sharing this single definition:
      - the {% for %} loop (populated with `item`)
      - the {% empty %} branch (no `item` -> blank row)
      - the <template id="item-row-template"> the JS clones for new rows

    `item` is undefined outside the loop, so |default:'' yields a blank row.
{% endcomment %}
<div class="item-row">

    <div class="form-group item-name-field">
        <label>Item Name</label>
        <input type="text" name="item_name[]" class="item-name"
               value="{{ item.item_name|default:'' }}" required>
    </div>

    <div class="form-group item-description-field">
        <label>Description</label>
        <input type="text" name="item_description[]" class="item-description"
               value="{{ item.description|default:'' }}">
    </div>

    <div class="form-group small-field">
        <label>Quantity</label>
        <input type="number" name="item_quantity[]" class="item-quantity"
               value="{{ item.quantity|default:'' }}" min="0" step="0.01" required>
    </div>

    <div class="form-group small-field">
        <label>Unit Price</label>
        <input type="number" name="item_unit_price[]" class="item-unit-price"
               value="{{ item.unit_price|default:'' }}" min="0" step="0.01" required>
    </div>

    <div class="form-group small-field">
        <label>Line Total</label>
        <input type="number" name="item_line_total[]" class="item-line-total"
               value="{{ item.line_total|default:'' }}" step="0.01" readonly>
    </div>

    <button type="button" class="remove-item-button">Remove</button>

</div>
